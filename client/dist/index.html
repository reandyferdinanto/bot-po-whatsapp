<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bot PO Dashboard | Google Sheets & Multi-OCR Integration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: 'Calibri', 'Carlito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #f1f5f9;
        -webkit-font-smoothing: antialiased;
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      /* Formula bar and spreadsheet styling */
      .gsheet-table {
        border-collapse: separate;
        border-spacing: 0;
        table-layout: fixed;
      }
      .gsheet-table th, .gsheet-table td {
        border-right: 1px solid #e2e8f0;
        border-bottom: 1px solid #e2e8f0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        box-sizing: border-box;
      }
      .col-letter {
        background-color: #f8fafc;
        color: #64748b;
        font-size: 11px;
        font-weight: 700;
        text-align: center;
        height: 22px;
        user-select: none;
      }
      .row-number {
        background-color: #f8fafc;
        color: #64748b;
        font-size: 11px;
        font-weight: 600;
        text-align: center;
        width: 40px;
        user-select: none;
      }
      .sticky-col-0 { position: sticky; left: 0; z-index: 20; }
      .sticky-col-1 { position: sticky; left: 40px; z-index: 20; }
      .sticky-col-2 { position: sticky; left: 88px; z-index: 20; }
      .freeze-border { border-right: 2px solid #cbd5e1 !important; }
      .cell-selected {
        outline: 2px solid #2563eb !important;
        outline-offset: -2px;
        background-color: rgba(37, 99, 235, 0.08) !important;
      }
      /* OCR Scanning Animations */
      @keyframes ocrLaserScan {
        0% { top: 0%; opacity: 0.4; }
        50% { top: 92%; opacity: 1; }
        100% { top: 0%; opacity: 0.4; }
      }
      @keyframes ocrPulseCard {
        0% { box-shadow: 0 0 0 0 rgba(2, 132, 199, 0.4); border-color: #0284c7; }
        50% { box-shadow: 0 0 0 8px rgba(2, 132, 199, 0.1); border-color: #059669; }
        100% { box-shadow: 0 0 0 0 rgba(2, 132, 199, 0.4); border-color: #0284c7; }
      }
      @keyframes ocrScanBar {
        0% { transform: scaleX(0.1); opacity: 0.4; }
        50% { transform: scaleX(1); opacity: 1; }
        100% { transform: scaleX(0.1); opacity: 0.4; }
      }
    </style>
